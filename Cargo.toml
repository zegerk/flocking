[package]
name = "flocking"
version = "0.1.7"
edition = "2021"
description = "A real-time friend-and-enemy swarm simulation for WebGL2 and WebAssembly"
license = "MIT"
repository = "https://github.com/zegerk/flocking"
readme = "README.md"
keywords = ["simulation", "webassembly", "webgl", "flocking", "visualization"]
categories = ["simulation", "visualization", "wasm", "graphics"]
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"

[dependencies.web-sys]
version = "0.3"
features = [
  "WebGl2RenderingContext",
  "WebGlProgram",
  "WebGlShader",
  "WebGlBuffer",
  "WebGlVertexArrayObject",
  "WebGlUniformLocation",
  "HtmlCanvasElement",
  "Window",
  "Document",
  "Performance",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
